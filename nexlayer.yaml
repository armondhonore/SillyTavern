application:
  name: sillytavern
  pods:
  - name: app
    image: ghcr.io/sillytavern/sillytavern:latest
    path: /
    servicePorts:
    - 8000
    vars:
      SILLYTAVERN_LISTEN: "true"
      SILLYTAVERN_WHITELISTMODE: "false"
      SILLYTAVERN_BASICAUTHMODE: "false"
      SILLYTAVERN_SECURITYOVERRIDE: "true"
    volumes:
    - name: sillytavern-data
      mountPath: /home/node/app/data
      size: 5Gi
